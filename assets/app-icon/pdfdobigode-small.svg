      C 374 270, 392 300, 418 306
      C 440 311, 458 300, 462 282
      C 466 266, 456 252, 442 254
      C 452 244, 474 248, 480 268
      C 488 298, 466 336, 428 344
      C 384 354, 344 336, 314 326
      C 290 318, 270 322, 256 340 Z"/>
  </defs>
  <g clip-path="url(#tile)">
