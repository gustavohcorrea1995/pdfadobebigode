[package]
name = "pdfdobigode-automation"
description = "Agent control for PDFDOBIGODE: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfdobigode-engine = { workspace = true }
pdfdobigode-cos = { workspace = true }
pdfdobigode-render = { workspace = true }
pdfdobigode-organize = { workspace = true }
pdfdobigode-platform = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
base64 = { version = "0.23", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
pdfdobigode-fonts = { workspace = true }
png = "0.18"
flate2.workspace = true
pdfdobigode-model = { workspace = true }
pdfdobigode-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
