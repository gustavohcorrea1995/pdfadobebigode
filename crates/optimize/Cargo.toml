[package]
name = "pdfdobigode-optimize"
description = "The PDF Optimizer: image downsampling and recompression, discarding objects, clean-up"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfdobigode-cos = { workspace = true }
pdfdobigode-filters = { workspace = true }
pdfdobigode-content = { workspace = true }
pdfdobigode-model = { workspace = true }
pdfdobigode-annot = { workspace = true }
thiserror.workspace = true
# JPEG decoding (zune-jpeg) and encoding, and bicubic resampling; already in the tree.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# The same JPEG decoder, used directly to read samples untransformed (/ColorTransform 0).
zune-jpeg = "0.5"

[dev-dependencies]
pdfdobigode-render = { workspace = true }
