[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/pdfdobigode", "apps/pdfdobigode-cli", "xtask"]

[workspace.package]
version = "0.14.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/gustavohcorrea1995/pdfadobebigode"

[workspace.dependencies]
# Shared frontend components; engines remain independent of egui.
craft-ui = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "edc41f68fa24c46651c3b5117d10f0ead75ec9cb", features = ["serde"] }
# Quit the macOS way (#1136): ⌘Q asks about unsaved changes, and closing quits through `terminate:`.
craft-quit = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "edc41f68fa24c46651c3b5117d10f0ead75ec9cb" }
# One menu definition for the native macOS menu bar and the in-window bar elsewhere.
craft-menu = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "edc41f68fa24c46651c3b5117d10f0ead75ec9cb" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "edc41f68fa24c46651c3b5117d10f0ead75ec9cb", default-features = false }
# Shared system spooler; document composition remains in pdfdobigode-print.
craft-print = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "42e30cd5b3f4b114270dd053fccbc33bedc47f68" }
# Whether a path stored in a document may be opened (GoToR link targets).
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "495e5971bc024aa96e6ed318cb6e7cd3a0103184", features = ["egui"] }
# internal
pdfdobigode-geom = { path = "crates/geom", version = "0.14.0" }
pdfdobigode-filters = { path = "crates/filters", version = "0.14.0" }
pdfdobigode-cos = { path = "crates/cos", version = "0.14.0" }
pdfdobigode-crypt = { path = "crates/crypt", version = "0.14.0" }
pdfdobigode-organize = { path = "crates/organize", version = "0.14.0" }
pdfdobigode-measure = { path = "crates/measure", version = "0.14.0" }
pdfdobigode-annot = { path = "crates/annot", version = "0.14.0" }
pdfdobigode-audit = { path = "crates/audit", version = "0.14.0" }
pdfdobigode-fonts = { path = "crates/fonts", version = "0.14.0" }
pdfdobigode-model = { path = "crates/model", version = "0.14.0" }
pdfdobigode-content = { path = "crates/content", version = "0.14.0" }
pdfdobigode-redact = { path = "crates/redact", version = "0.14.0" }
pdfdobigode-print = { path = "crates/print", version = "0.14.0" }
pdfdobigode-xfdf = { path = "crates/xfdf", version = "0.14.0" }
pdfdobigode-sign = { path = "crates/sign", version = "0.14.0" }
pdfdobigode-optimize = { path = "crates/optimize", version = "0.14.0" }
pdfdobigode-a11y = { path = "crates/a11y", version = "0.14.0" }
pdfdobigode-oracle = { path = "crates/oracle", version = "0.14.0" }
pdfdobigode-testkit = { path = "crates/testkit", version = "0.14.0" }
pdfdobigode-ocr = { path = "crates/ocr", version = "0.14.0" }
pdfdobigode-js = { path = "crates/js", version = "0.14.0" }
pdfdobigode-compare = { path = "crates/compare", version = "0.14.0" }
pdfdobigode-preflight = { path = "crates/preflight", version = "0.14.0" }
pdfdobigode-export = { path = "crates/export", version = "0.14.0" }
pdfdobigode-edit = { path = "crates/edit", version = "0.14.0" }
pdfdobigode-create = { path = "crates/create", version = "0.14.0" }
pdfdobigode-forms = { path = "crates/forms", version = "0.14.0" }
pdfdobigode-xfa = { path = "crates/xfa", version = "0.14.0" }
pdfdobigode-render = { path = "crates/render", version = "0.14.0" }
pdfdobigode-engine = { path = "crates/engine", version = "0.14.0" }
pdfdobigode-platform = { path = "crates/platform", version = "0.14.0" }
pdfdobigode-ui-egui = { path = "crates/ui-egui", version = "0.14.0" }
pdfdobigode-automation = { path = "crates/automation", version = "0.14.0", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

# testing
proptest = "1"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
# Monotonic time for logic-only work on native and web (`App::logic` runs without a UI pass).
web-time = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Dependencies
# carry no debug info and our own crates only line tables: backtraces and
# panics still show file and line, while test binaries and the target dir stay
# small (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.low-disk]
inherits = "dev"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/hayro-postscript" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
vello_common = { path = "vendor/vello_common" }
# The egui and winit crates below are pinned to immutable storytold git revisions (egui
# 6d518fc799681571963842f95b55a6b68431b15a, winit a517b3846ee8457d84ee4975110bfda6797c44dc).
# Only the retained `vendor/winit` and `vendor/egui-wgpu` copies are provenance for the app's
# earlier patches and their source guards, not path patches; the other `vendor/` entries above
# remain real path patches. See vendor/README.md and the migration plan.
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# craft-libs at edc41f68 has a craft-menu manifest Cargo rejects ("`default-features = false`
# cannot override workspace's `default-features`"), so no build could resolve craft-menu. The two
# crates involved are vendored with self-contained manifests; their sources are unchanged
# (vendor/README.md). Drop this once craft-libs fixes the manifest and the revs are bumped.
[patch."https://github.com/storytold/craft-libs"]
craft-menu = { path = "vendor/craft-menu" }
craft-keymap = { path = "vendor/craft-keymap" }
