# Vendored from storytold/craft-libs at edc41f68fa24c46651c3b5117d10f0ead75ec9cb (crates/keymap),
# unchanged except this manifest: workspace inheritance resolved and dev-dependencies dropped, so
# craft-menu's `default-features = false` no longer trips Cargo's edition-2024 check. See
# vendor/README.md.
[package]
name = "craft-keymap"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/craft-libs"
rust-version = "1.95"
description = "Keyboard bindings for the Craft suite: chords, keymaps, conflicts, overrides and shortcut-set import"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { version = "0.37", default-features = false, optional = true }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "edc41f68fa24c46651c3b5117d10f0ead75ec9cb", version = "0.1.0", optional = true }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "edc41f68fa24c46651c3b5117d10f0ead75ec9cb", version = "0.1.0", optional = true }

[features]
egui = ["dep:egui"]
# The Keyboard Shortcuts dialog.
ui = ["egui", "dep:craft-ui", "dep:craft-i18n"]
